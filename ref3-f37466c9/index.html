<h1>تقييم 30 سؤال</h1><p class="note">لكل سؤال اضغط درجة من خمس: ممتاز، حلو، عادي، ضعيف، أو ما يسوى. الجواب مكتوب تحته. تقدمك ينحفظ في المتصفح، ولما تخلص (أو متى ما تبي) اضغط «أرسل الملف».</p>

A399j2jw=="};const PWK='dakkat_pw_ref';const KEY='dakkat_ref3_v1';let S={r:{}};
try{S=Object.assign(S,JSON.parse(localStorage.getItem(KEY)||'{}'));}catch(e){}
function esc(t){return String(t).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}
function rate(id,v){S.r[id]=v;localStorage.setItem(KEY,JSON.stringify(S));paint(id);progress();}
function paint(id){const el=document.getElementById('f_'+id);if(!el)return;el.classList.toggle('done',S.r[id]!==undefined);el.querySelectorAll('button').forEach(b=>{const v=b.getAttribute('data-v');b.className=(String(S.r[id])===v)?('on'+v):'';});}
function build(){let h='',sub='';DATA.forEach(x=>{if(x.sub!==sub){sub=x.sub;h+='<h2>'+esc(sub)+'</h2>';}
h+='<div class="card" id="f_'+x.id+'"><div><span class="lv">'+x.lv+'</span>'+esc(x.q)+'</div><div class="q">الجواب: '+esc(x.a)+'</div>'+[[5,'ممتازة'],[4,'حلوة'],[3,'عادية'],[2,'ضعيفة'],[1,'ما تسوى']].map(o=>'<button data-v="'+o[0]+'" onclick="rate(\''+x.id+'\','+o[0]+')">'+o[1]+'</button>').join('')+'</div>';});
document.getElementById('list').innerHTML=h;DATA.forEach(x=>paint(x.id));progress();}
function progress(){document.getElementById('prog').textContent='خلصت '+Object.keys(S.r).length+' من '+DATA.length;}
function exportJSON(){return JSON.stringify({version:2,scale:'1-5',category:'ref3',saved_at:new Date().toISOString(),total:DATA.length,ratings:S.r},null,1);}
function downloadJSON(txt){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([txt],{type:'application/json'}));a.download='ref3_khalid.json';document.body.appendChild(a);a.click();a.remove();}
async function shareJSON(){const txt=exportJSON();try{const f=new File([txt],'ref3_khalid.json',{type:'application/json'});if(navigator.canShare&&navigator.canShare({files:[f]})){await navigator.share({files:[f],title:'ref3_khalid'});return}}catch(e){if(e&&e.name==='AbortError')return}downloadJSON(txt);}
async function copyJSON(){const txt=exportJSON();try{await navigator.clipboard.writeText(txt);alert('انتسخ. الصقه في تيليجرام وأرسله');}catch(e){prompt('انسخ النص وأرسله',txt);}}
const b64=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
async function dec(p){const km=await crypto.subtle.importKey('raw',new TextEncoder().encode(p),'PBKDF2',false,['deriveKey']);
const k=await crypto.subtle.deriveKey({name:'PBKDF2',salt:b64(B.s),iterations:B.it,hash:'SHA-256'},km,{name:'AES-GCM',length:256},false,['decrypt']);
const buf=await crypto.subtle.decrypt({name:'AES-GCM',iv:b64(B.iv)},k,b64(B.ct));
return await new Response(new Blob([buf]).stream().pipeThrough(new DecompressionStream('gzip'))).text();}
async function tryPw(p){try{DATA=JSON.parse(await dec(p));}catch(e){localStorage.removeItem(PWK);return false}localStorage.setItem(PWK,p);document.getElementById('gate').innerHTML='';document.getElementById('main').style.display='';build();return true}
function gate(bad){document.getElementById('gate').innerHTML='<div class="card"><b>كلمة السر</b><p class="note">نفس كلمة السر حقت صفحات التقييم. تنطلب أول مرة بس.</p><input id="pw" type="password" style="width:100%;box-sizing:border-box;font-size:18px;padding:10px;border:1px solid #999;border-radius:6px;text-align:center"><p class="note" id="pwmsg" style="color:#b3392f">'+(bad?'كلمة السر غلط، جرّب مرة ثانية':'')+'</p><button onclick="submitPw()">دخول</button></div>';}
async function submitPw(){const v=document.getElementById('pw').value.trim();if(!v)return;document.getElementById('pwmsg').textContent='جاري الفتح...';if(!(await tryPw(v)))gate(true);}
async function boot(){const p=localStorage.getItem(PWK);if(p&&await tryPw(p))return;gate(false);}
boot();
